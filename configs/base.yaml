mode: dev
comparable: false
llm_contract_file: llm.yaml
retrieval:
  top_k: 20
  bm25_dense_weights: [0.5, 0.5]
  bm25s:
    version: pinned-by-lockfile
    analyzer: unicode_word
    tokenizer: unicode_word
    k1: 1.2
    b: 0.75
    document_unit: message
    field_weighting: {body: 1.0}
    tie_order: media_id
    score_normalization: min_max
embeddings:
  text_embedding_model: bge-m3
  visual_model: siglip2-base-patch16-384
chunking:
  max_messages: 20
  max_tokens: 400
context:
  strategies: {reply_thread: true, temporal: true, same_sender: true, participant: true, semantic: true}
  context_window: 8
  token_budget: 4000
controller:
  clue_extraction_strategy: deterministic_first
  jump_query_strategy: evidence_driven
  max_rounds: 3
  max_jumps: 2
dataset:
  dup_threshold: 0.95
  phash_threshold: 8
  split_salt: phase-2-to-be-set
  review_salt: phase-2-to-be-set
scope:
  default_deny: true
  default_caller_id: null
demo:
  viewer_id: demo_viewer
  channel_id: demo_channel
runtime:
  # Phase 3 supplies a measured value; null deliberately means "not set yet".
  index_visibility_sla: null
  draft_media_ttl: 24h
visual_expectations:
  expected_device: cpu
  model_name: google/siglip2-base-patch16-384
  model_version: f775b65a79762255128c981547af89addcfe0f88
  preprocessing:
    image_size: [384, 384]
    interpolation: bicubic
    normalization: siglip
