[project]
name = "vsf-chat-search-image"
version = "0.1.0"
description = "Contextual multimodal retrieval for chat history"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bm25s>=0.2,<0.3",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not capability'"
markers = ["capability: explicitly enabled live OpenRouter capability probe"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vsf"]
