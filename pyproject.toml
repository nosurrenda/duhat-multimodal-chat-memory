[project]
name = "vsf-chat-search-image"
version = "0.1.0"
description = "Contextual multimodal retrieval for chat history"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bm25s>=0.2,<0.3",
  "fastapi>=0.115,<1",
  "numpy>=2.0,<3",
  "Pillow>=10,<12",
  "minio>=7.2,<8",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0,<7",
  "torch>=2.5,<3",
  "transformers>=4.48,<5",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not capability'"
markers = ["capability: explicitly enabled live OpenRouter capability probe"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/config", "src/artifacts", "src/evaluation", "src/ingest", "src/model_service", "src/repository", "src/trace"]
