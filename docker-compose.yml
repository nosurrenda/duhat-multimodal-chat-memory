services:
  postgres:
    # Version-pinned ParadeDB PG16 image. It carries both pgvector and pg_search.
    image: paradedb/paradedb:v0.25.10-pg16@sha256:0464d03d0c1da3467268f3a306945900112968db9ff8a1076a175ce46b9c2bf8
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vsf}
      POSTGRES_USER: ${POSTGRES_USER:-vsf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vsf_local_only}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsf -d vsf"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vsf_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vsf_minio_local_only}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio_data:/data
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-vsf_minio} $${MINIO_ROOT_PASSWORD:-vsf_minio_local_only} && mc mb --ignore-existing local/$${MINIO_BUCKET:-vsf-media}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vsf_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vsf_minio_local_only}
      MINIO_BUCKET: ${MINIO_BUCKET:-vsf-media}

volumes:
  postgres_data:
  minio_data:
